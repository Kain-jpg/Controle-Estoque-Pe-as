
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de estoque - entrada e saída</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1, h2 {
            color: #333;
        }

        form {
            max-width: 500px;
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 7px;
            margin-top: 4px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 8px 15px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <h1>Lista de estoque - entrada e saída</h1>

    <h2 id="titulo-formulario">Cadastrar novo item</h2>

    <form id="form-item">

        <!-- Campo oculto que guarda o ID do item -->
        <input type="hidden" id="id_item" value="">

        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" required>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="0" step="1" required>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" min="0" step="0.01" required>

        <button type="submit" id="botao-salvar">
            Cadastrar item
        </button>

        <button type="button" id="botao-cancelar" style="display:none">
            Cancelar edição
        </button>

    </form>

    <div id="mensagem">Carregando itens...</div>

    <h2>Lista de itens</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Ação</th>
            </tr>
        </thead>

        <tbody id="itens-body"></tbody>
    </table>

    <script>

        
// MONTA A TABELA
function montarPaginaItens(rows) {

    const tbody = document.getElementById('itens-body');

    tbody.innerHTML = '';

    if (!rows || rows.length === 0) {
        tbody.innerHTML =
            '<tr><td colspan="5">Nenhum item cadastrado.</td></tr>';
        return;
    }

    rows.forEach(a => {

        const tr = document.createElement('tr');

        [a.id, a.descricao, a.quantidade, Number(a.preco).toFixed(2)]
            .forEach(valor => {

                const td = document.createElement('td');
                td.textContent = valor ?? '';
                tr.appendChild(td);

            });

        // Botão para editar o item
        const tdAcao = document.createElement('td');

        const botaoEditar = document.createElement('button');

        botaoEditar.textContent = 'Editar';

        botaoEditar.addEventListener('click', () => {
            editarItem(a);
        });

        tdAcao.appendChild(botaoEditar);

        const botaoEntrada = document.createElement('button');
        botaoEntrada.textContent = 'Entrada';
        botaoEntrada.addEventListener('click', () => {
            movimentarEstoque(a.id, 'entrada');
        });
        tdAcao.appendChild(botaoEntrada);

        const botaoSaida = document.createElement('button');
        botaoSaida.textContent = 'Saída';
        botaoSaida.addEventListener('click', () => {
            movimentarEstoque(a.id, 'saida');
        });
        tdAcao.appendChild(botaoSaida);

        // Botão para excluir o item
        const botaoExcluir = document.createElement('button');

        botaoExcluir.textContent = 'Excluir';

        botaoExcluir.addEventListener('click', () => {
            excluirItem(a.id);
        });

        tdAcao.appendChild(botaoExcluir);

        tr.appendChild(tdAcao);

        tbody.appendChild(tr);

    });
}


async function movimentarEstoque(id, tipo) {

    const quantidade = Number(prompt(`Informe a quantidade para ${tipo}:`));

    if (!Number.isInteger(quantidade) || quantidade <= 0) {
        alert('Informe uma quantidade inteira maior que zero.');
        return;
    }

    try {
        const resposta = await fetch(`/api/itens/${id}/movimentacoes`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tipo, quantidade })
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(resultado.erro || 'Erro ao movimentar estoque.');
        }

        alert(resultado.mensagem);
        await carregarItens();
    } catch (erro) {
        alert('Erro ao movimentar estoque: ' + erro.message);
    }
}


async function excluirItem(id) {

    // Confirma se deseja excluir
    if (!confirm('Tem certeza que deseja excluir este item?')) {
        return;
    }

    try {

        // Envia a requisição para o servidor
        const resposta = await fetch('/api/itens/' + id, {
            method: 'DELETE'
        });

        const resultado = await resposta.json();

        if (!resposta.ok) {
            throw new Error(resultado.erro || 'Erro ao excluir item.');
        }

        // Exibe mensagem
        alert(resultado.mensagem);

        // Atualiza a tabela
        await carregarItens();

    } catch (erro) {

        alert('Erro ao excluir item: ' + erro.message);

    }
}


        // BUSCA OS ITENS
        async function carregarItens() {

            const mensagem = document.getElementById('mensagem');

            try {

                const resposta = await fetch('/api/itens');

                if (!resposta.ok) {
                    throw new Error('Erro HTTP: ' + resposta.status);
                }

                const itens = await resposta.json();

                montarPaginaItens(itens);

                mensagem.textContent =
                    'Itens carregados: ' + itens.length;

            } catch (erro) {

                mensagem.textContent =
                    'Erro ao carregar itens: ' + erro.message;

                console.error(erro);
            }
        }

        // PREENCHE O FORMULÁRIO PARA EDIÇÃO
        function editarItem(item) {

            document.getElementById('id_item').value = item.id;

            document.getElementById('descricao').value = item.descricao;
            document.getElementById('quantidade').value = item.quantidade;
            document.getElementById('preco').value = item.preco;

            document.getElementById('titulo-formulario').textContent =
                'Alterar dados do item';

            document.getElementById('botao-salvar').textContent =
                'Salvar alterações';

            document.getElementById('botao-cancelar').style.display =
                'inline-block';
        }

        // CANCELA A EDIÇÃO
        function cancelarEdicao() {

            document.getElementById('id_item').value = '';

            document.getElementById('form-item').reset();

            document.getElementById('titulo-formulario').textContent =
                'Cadastrar novo item';

            document.getElementById('botao-salvar').textContent =
                'Cadastrar item';

            document.getElementById('botao-cancelar').style.display =
                'none';
        }

        document.getElementById('botao-cancelar')
            .addEventListener('click', cancelarEdicao);

        // CADASTRA OU ALTERA O ITEM
        document.getElementById('form-item')
            .addEventListener('submit', async (evento) => {

                evento.preventDefault();

                const mensagem = document.getElementById('mensagem');

                const item = {

                    descricao: document.getElementById('descricao').value,
                    quantidade: document.getElementById('quantidade').value,
                    preco: document.getElementById('preco').value
                };

                try {

                    let resposta;

                    // Verifica se existe um ID no campo oculto
                    const idItem = document.getElementById('id_item').value;

                    if (idItem !== '') {

                        // ALTERA O ITEM
                        resposta = await fetch(
                            '/api/itens/' + idItem,
                            {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(item)
                            }
                        );

                    } else {

                        // CADASTRA UM NOVO ITEM
                        resposta = await fetch('/api/itens', {

                            method: 'POST',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify(item)

                        });
                    }

                    const resultado = await resposta.json();

                    if (!resposta.ok) {
                        throw new Error(
                            resultado.erro || 'Erro ao salvar item.'
                        );
                    }

                    mensagem.textContent =
                        resultado.mensagem || 'Operação realizada com sucesso!';

                    cancelarEdicao();

                    await carregarItens();

                } catch (erro) {

                    mensagem.textContent =
                        'Erro ao salvar item: ' + erro.message;

                    console.error(erro);
                }

            });

        // CARREGA OS ITENS AO ABRIR A PÁGINA
        document.addEventListener('DOMContentLoaded', carregarItens);

    </script>

</body>
</html>
